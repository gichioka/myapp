services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    working_dir: /app
    volumes:
      - ./:/app
      - storage_data:/app/storage
      # vendor_data を除外することで、ホストとコンテナのcomposer管理を一致させます
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: Laravel
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: myapp_db
      DB_USERNAME: laravel
      DB_PASSWORD: mypass123!!
      
      MYSQL_ATTR_SSL_CA: ""

    restart: unless-stopped

volumes:
  storage_data: