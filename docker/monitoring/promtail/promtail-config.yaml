server:
  http_listen_port: 9080
  grpc_listen_port: 0


positions:
  filename: /tmp/positions.yaml


clients:
  - url: http://loki:3100/loki/api/v1/push


scrape_configs:
  - job_name: laravel

    static_configs:
      - targets:
          - localhost
        labels:
          app: myapp
          env: local
          job: laravel
          service: laravel
          __path__: /var/log/laravel/*.log

    pipeline_stages:
      - multiline:
          firstline: '^\['
          max_wait_time: 3s